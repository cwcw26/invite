<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>소리 비교</title>
<style>
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center;
         justify-content:center; gap:16px; background:#20903A; color:#fff;
         font-family:'Noto Serif KR', AppleMyungjo, serif; padding:26px; box-sizing:border-box; }
  h1 { font-size:21px; font-weight:500; margin:0; }
  p  { margin:0; font-size:15px; line-height:1.7; text-align:center; opacity:.9; }
  button { width:100%; max-width:330px; padding:18px; font:inherit; font-size:18px; color:#fff;
           background:rgba(0,0,0,.18); border:1px solid rgba(255,255,255,.55); border-radius:14px; }
  button:active { transform:scale(.98); }
  #now { font-size:16px; min-height:1.6em; }
</style>
</head>
<body>
  <h1>소리 비교</h1>
  <p>각 단추를 누르고 <b>10초 이상</b> 들어 보세요.<br>휴대폰 음량은 바꾸지 마세요.</p>
  <button data-src="assets/a-old.mp4">① 직전 소리</button>
  <button data-src="https://cwcw26.github.io/invite/sanneomeo/assets/bgm-v3.mp4">② 지금 초대장 소리</button>
  <button data-src="assets/c-tiny.mp4">③ 거의 무음 (1000분의 1)</button>
  <button data-stop>■ 멈추기</button>
  <p id="now"></p>
  <p style="font-size:14px;opacity:.75">③ 까지 같은 크기로 들리면,<br>휴대폰이 작은 소리를 키우고 있는 것입니다.</p>
  <audio id="p" loop></audio>
<script>
  const audio = document.getElementById('p');
  const now = document.getElementById('now');
  document.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
    if (b.hasAttribute('data-stop')) { audio.pause(); now.textContent = '멈춤'; return; }
    audio.src = b.dataset.src;
    audio.currentTime = 0;
    audio.play().then(() => { now.textContent = '재생 중 — ' + b.textContent.trim(); })
                .catch((e) => { now.textContent = '재생 실패: ' + e.name; });
  }));
</script>
</body>
</html>
